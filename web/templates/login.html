<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BetBot — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { bg:'#0f0f1a', card:'#16213e', accent:'#1f538d' } } }
    }
  </script>
</head>
<body class="bg-bg min-h-screen flex items-center justify-center">
  <div class="bg-card rounded-2xl p-8 w-full max-w-sm mx-4 shadow-2xl">
    <div class="text-center mb-8">
      <div class="text-4xl mb-3">⚽</div>
      <h1 class="text-2xl font-bold text-white">BetBot</h1>
      <p class="text-gray-400 text-sm mt-1">Value Betting Dashboard</p>
    </div>

    {% if request.query_params.get('error') %}
    <div class="bg-red-900/40 border border-red-500/50 text-red-300 text-sm rounded-lg px-4 py-3 mb-4">
      Λάθος username ή password.
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="next" value="{{ request.query_params.get('next', '/pregame') }}"/>
      <div>
        <label class="text-gray-400 text-sm block mb-1">Username</label>
        <input name="username" type="text" required autocomplete="username"
          class="w-full bg-gray-800 text-white rounded-lg px-4 py-3 border border-gray-600
                 focus:border-blue-500 focus:outline-none"/>
      </div>
      <div>
        <label class="text-gray-400 text-sm block mb-1">Password</label>
        <input name="password" type="password" required autocomplete="current-password"
          class="w-full bg-gray-800 text-white rounded-lg px-4 py-3 border border-gray-600
                 focus:border-blue-500 focus:outline-none"/>
      </div>
      <button type="submit"
        class="w-full bg-accent hover:bg-blue-700 text-white font-semibold py-3 rounded-lg
               transition-colors mt-2">
        Είσοδος
      </button>
    </form>
  </div>
</body>
</html>
